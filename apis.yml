aid: invesdor
name: Invesdor
description: >-
  Invesdor is a pan-European crowdinvesting and digital investment platform that
  connects private and professional investors with companies raising capital
  through equity, subordinated loans, and bonds, with minimum tickets starting
  around EUR 250. Founded in Finland in 2012 and expanded through mergers with
  Finnest, Kapilendo, and Oneplanetcrowd, Invesdor now serves more than 180,000
  investors across Europe and has channeled over EUR 600 million into more than
  1,000 renewable-energy, scale-up, and SME financing rounds. It operates as a
  regulated investment firm under the EU Crowdfunding Service Provider (ECSP)
  regime. Invesdor does not currently publish a public developer API or developer
  portal; this profile tracks its public web, investor, and legal surface in the
  API Evangelist network.
